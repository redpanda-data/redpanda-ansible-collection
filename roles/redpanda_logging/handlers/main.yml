---
# Handlers for redpanda_logging role

- name: Restart rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted
  become: true

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Restart redpanda services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
  become: true
  loop:
    - redpanda
    - redpanda-connect
    - redpanda-console
  failed_when: false  # Don't fail if service doesn't exist

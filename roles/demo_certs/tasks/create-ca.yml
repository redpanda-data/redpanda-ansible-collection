#
# Creates a local CA in $dir/ca (if one does not exist)
#

---
- name: Check existence of Root CA directory {{ root_ca_dir }}
  delegate_to: localhost
  ansible.builtin.file:
    path: "{{ root_ca_dir }}"
    state: directory
    mode: "0700"
  tags:
    - create_ca

- name: Copy the ca.conf file to CA
  delegate_to: localhost
  ansible.builtin.template:
    src: ca.conf.tpl
    dest: "{{ root_ca_dir }}/ca.conf"
    mode: "0644"
  tags:
    - create_ca

- name: Generate an OpenSSH keypair for the CA
  delegate_to: localhost
  ansible.builtin.command:
    chdir: "{{ root_ca_dir }}"
    cmd: openssl genrsa -out ca.key 2048
    creates: ca.key
  tags:
    - create_ca

- name: Protect the CA private key
  delegate_to: localhost
  ansible.builtin.file:
    path: "{{ root_ca_dir }}/ca.key"
    mode: "0600"
  tags:
    - create_ca

- name: Generate self-signed CA certificate
  delegate_to: localhost
  ansible.builtin.command:
    chdir: "{{ root_ca_dir }}"
    cmd: openssl req -new -x509 -config ca.conf -key ca.key -out ca.crt -days 365 -batch
    creates: ca.crt
  tags:
    - create_ca

# Only ever initialize a fresh CA: wiping index/serial on an existing CA
# resets the serial counter and re-issues serials already in circulation.
- name: Initialize CA data files
  delegate_to: localhost
  ansible.builtin.shell: |
    cd {{ root_ca_dir }}
    touch index.txt
    echo '01' > serial.txt
  args:
    creates: "{{ root_ca_dir }}/serial.txt"
  tags:
    - create_ca

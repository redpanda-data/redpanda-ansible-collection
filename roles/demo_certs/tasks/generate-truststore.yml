---
- name: Set facts
  ansible.builtin.set_fact:
    node_cert: tls/certs/{{ansible_hostname}}/node.crt
    truststore_file: tls/certs/{{ansible_hostname}}/{{ truststore_file_name }}
  delegate_to: localhost
  tags: generate_truststore

- name: Check for existing truststore
  delegate_to: localhost
  ansible.builtin.stat:
    path: "{{ truststore_file }}"
  register: truststore_stat
  tags: generate_truststore

# The store password is delivered via the environment (keytool's
# -storepass:env) so it never appears on a recorded command line.
- name: Create the truststore
  delegate_to: localhost
  ansible.builtin.command:
    cmd: >
      keytool -importcert -noprompt -file {{ node_cert }}
      -alias {{ ansible_hostname }} -keystore {{ truststore_file }}
      -storepass:env TRUSTSTORE_PASSWORD -storetype {{ truststore_type }}
  environment:
    TRUSTSTORE_PASSWORD: "{{ truststore_password }}"
  when: not truststore_stat.stat.exists
  tags: generate_truststore

- name: Import the CA certificate into the truststore
  delegate_to: localhost
  ansible.builtin.command:
    cmd: >
      keytool -importcert -noprompt -file {{ root_ca_dir }}/ca.crt
      -alias ca -keystore {{ truststore_file }}
      -storepass:env TRUSTSTORE_PASSWORD -storetype {{ truststore_type }}
  environment:
    TRUSTSTORE_PASSWORD: "{{ truststore_password }}"
  when: not truststore_stat.stat.exists
  tags: generate_truststore

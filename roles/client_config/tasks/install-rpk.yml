- name: Set architecture fact for url
  ansible.builtin.set_fact:
    rpk_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' if ansible_architecture == 'aarch64' else 'unsupported' }}"
  tags: [client_rpk_url]

# rpk_url wins outright; otherwise the URL derives from rpk_base_url and
# rpk_version so mirrors and pins actually take effect.
- name: Determine rpk download url
  ansible.builtin.set_fact:
    rpk_download_url: "{{ rpk_url | default(rpk_base_url + ('/latest/download' if rpk_version == 'latest' else '/download/' + rpk_version) + '/rpk-linux-' + rpk_arch + '.zip') }}"
  tags: [client_rpk_url]

- name: Ensure unzip is installed
  ansible.builtin.package:
    name: unzip
    state: present
  become: true

- name: Download Redpanda rpk zip
  ansible.builtin.get_url:
    url: "{{ rpk_download_url }}"
    dest: "/tmp/rpk-linux-{{ rpk_arch }}.zip"
    checksum: "{{ rpk_checksum | default(omit) }}"
    mode: '0644'
  when: rpk_arch in ['amd64', 'arm64']

- name: Unzip Redpanda rpk to /usr/local/bin
  ansible.builtin.unarchive:
    src: "/tmp/rpk-linux-{{ rpk_arch }}.zip"
    dest: /usr/local/bin
    remote_src: true
  become: true
  when: rpk_arch in ['amd64', 'arm64']

- name: Fail for unsupported architecture
  ansible.builtin.fail:
    msg: "The architecture '{{ ansible_architecture }}' is not supported for Redpanda rpk installation"
  when: rpk_arch == 'unsupported'

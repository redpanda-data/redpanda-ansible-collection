---
- name: Set facts
  ansible.builtin.set_fact:
    keystores_file: tls/certs/{{ansible_hostname}}/{{ keystores_file_name}}
  delegate_to: localhost
  tags: copy_truststore

- name: Ensure /etc/redpanda/keystores exists
  ansible.builtin.file:
    path: "{{ redpanda_keystores_dir }}"
    state: directory
    owner: redpanda
    group: redpanda
    mode: "0755"
  tags: copy_truststore

# keystores_file is a control-node-relative path (it is the copy task's
# src), so the existence check must run on the control node. Without the
# delegation the stat resolves against the remote user's home, misses any
# staged keystore, and a self-signed keystore is regenerated on every run.
- name: Check if keystores file exists on the control node
  ansible.builtin.stat:
    path: "{{ keystores_file }}"
  delegate_to: localhost
  register: keystores_file_stat

- name: Copy keystore to remote hosts in connect group
  ansible.builtin.copy:
      src: "{{ keystores_file }}"
      dest: "{{ redpanda_keystores_dir }}/{{ keystores_file_name }}"
      owner: redpanda
      group: redpanda
      mode: "0644"
  tags: copy_truststore
  when: keystores_file_stat.stat.exists

# The password is handed to openssl via the environment (-password env:...)
# so it never appears on the command line (visible in ps) and, together with
# no_log, never lands in logs or callback output. creates makes reruns a
# no-op instead of rewriting the keystore on every run.
- name: Create the keystore with a self-signed certificate
  ansible.builtin.command:
    cmd: >
      openssl {{ ssl_keystore_type | lower }} -export -in {{ redpanda_cert_file }} -inkey {{ redpanda_key_file }}
      -out {{ ssl_keystore_location }} -name {{ ansible_hostname }} -password env:REDPANDA_SSL_KEYSTORE_PASSWORD
    creates: "{{ ssl_keystore_location }}"
  environment:
    REDPANDA_SSL_KEYSTORE_PASSWORD: "{{ ssl_keystore_password }}"
  no_log: true
  tags: generate_keystore
  when: not keystores_file_stat.stat.exists

- name: Ensure /etc/redpanda/keystores exists
  ansible.builtin.file:
    path: "{{ ssl_keystore_location }}"
    state: file
    owner: redpanda
    group: redpanda
    mode: "0755"
  tags: copy_truststore
  when: not keystores_file_stat.stat.exists

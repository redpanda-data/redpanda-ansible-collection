# connect-log4j.properties is owned by generate-log4j-config.yml (driven by
# log4j_config_override_content); this file only produces the jmx exporter
# config.

# The template lookup returns a string on some ansible-core versions and an
# already-parsed mapping on others (2.18's native types vs 2.20); the mapping
# guard handles both, and combine
# below merges dicts
- name: Load template contents
  ansible.builtin.set_fact:
    jmx_exporter_config: "{{ _jmx_rendered if (_jmx_rendered is mapping) else (_jmx_rendered | from_json) }}"
  vars:
    _jmx_rendered: "{{ lookup('template', 'jmx-exporter-config.json.j2') }}"

- name: Merge with user-provided overrides
  ansible.builtin.set_fact:
    jmx_exporter_config: "{{ jmx_exporter_config | combine((_jmx_override if (_jmx_override is mapping) else (_jmx_override | from_json)), recursive=True) }}"
  vars:
    _jmx_override: "{{ jmx_exporter_override | default('{}') }}"

- name: Instantiate jmx-exporter file
  ansible.builtin.copy:
    content: "{{ jmx_exporter_config | to_nice_json }}"
    dest: "{{ redpanda_connect_config_dir }}/jmx-exporter-config.json"
    owner: "{{ redpanda_user }}"
    group: "{{ redpanda_group }}"
    mode: '0644'
    force: true
  register: jmx_exporter_config_result

# connect-log4j.properties is owned by generate-log4j-config.yml (driven by
# log4j_config_override_content); this file only produces the jmx exporter
# config.

# from_json is required: the template lookup returns a string, and combine
# below merges dicts
- name: Load template contents
  ansible.builtin.set_fact:
    jmx_exporter_config: "{{ lookup('template', 'jmx-exporter-config.json.j2') | from_json }}"

- name: Merge with user-provided overrides
  ansible.builtin.set_fact:
    jmx_exporter_config: "{{ jmx_exporter_config | combine((jmx_exporter_override | default('{}') | from_json), recursive=True) }}"

- name: Instantiate jmx-exporter file
  ansible.builtin.copy:
    content: "{{ jmx_exporter_config | to_nice_json }}"
    dest: "{{ redpanda_connect_config_dir }}/jmx-exporter-config.json"
    owner: "{{ redpanda_user }}"
    group: "{{ redpanda_group }}"
    mode: '0644'
    force: true
  register: jmx_exporter_config_result

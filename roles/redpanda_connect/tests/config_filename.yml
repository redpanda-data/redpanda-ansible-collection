---
# Runs the real connect-distributed generator and the systemd unit generator
# so tests can assert the properties file lands where the unit's ExecStart
# points. Bare include_tasks does not load role defaults, so every variable
# arrives via extravars.
- hosts: connect
  gather_facts: false
  tasks:
    - include_tasks: /app/tasks/create-user.yml
      tags: [always]
    - name: Ensure the config dir exists
      ansible.builtin.file:
        path: "{{ redpanda_connect_config_dir }}"
        state: directory
        mode: "0755"
      tags: [always]
    - include_tasks: /app/tasks/generate-connect-distributed.yml
      tags: [always]
    - include_tasks: /app/tasks/generate-unit-file.yml
      tags: [always]

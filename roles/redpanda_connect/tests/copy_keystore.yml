---
# Runs the real user-creation and keystore tasks so tests can exercise the
# copy-vs-generate decision and the generated-keystore command for real.
# Bare include_tasks does not load role defaults, so every variable the
# tasks need arrives via playbook extravars.
- hosts: connect
  gather_facts: false
  tasks:
    - include_tasks: /app/tasks/create-user.yml
      tags: [always]
    - include_tasks: /app/tasks/copy-keystore.yml
      tags: [always]

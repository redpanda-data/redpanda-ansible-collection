---
# Runs the log4j and jmx-exporter generator task files in the same order
# main.yml does, so tests can assert which content wins in the final
# connect-log4j.properties. Bare include_tasks does not load role defaults,
# so every variable arrives via extravars.
- hosts: connect
  gather_facts: false
  tasks:
    - include_tasks: /app/tasks/create-user.yml
      tags: [always]
    - name: Ensure the config dir exists
      ansible.builtin.file:
        path: "{{ redpanda_connect_config_dir }}"
        state: directory
        mode: "0755"
      tags: [always]
    - include_tasks: /app/tasks/generate-log4j-config.yml
      tags: [always]
    - include_tasks: /app/tasks/generate-jmx-exporter-config.yml
      tags: [always]

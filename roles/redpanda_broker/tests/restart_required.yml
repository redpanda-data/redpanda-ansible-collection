---
- hosts: localhost
  gather_facts: false
  vars:
    redpanda_rpk_opts: ""
    redpanda_broker_no_log: false
    node_id: "0"
    sasl_superuser_username: admin
    sasl_superuser_password: test-password
    # kafka_enable_authorization, is_initialized, nodeconfig_result,
    # package_result and restart_node are supplied per test case via extravars.
  tasks:
    # The "always" tag ensures this include_tasks directive itself is not
    # skipped by --tags filtering. Once included, Ansible applies --tags
    # filtering to the individual tasks inside start-redpanda.yml, so only
    # the restart-detection tasks (broker_check_restart,
    # broker_check_restart_noauth, broker_restart_required) run. That
    # exercises the role's real registration and restart logic rather than a
    # copy of it; rpk is a PATH mock supplied by the test.
    - include_tasks: /app/tasks/start-redpanda.yml
      tags: [always]
    - debug:
        var: restart_required

---
# attempt to do a rolling, serial restart by putting each node into maintenance
# mode, restarting, and putting it back into service. This is throttled to allow
# only one node out of service at a time.
#
- name: Enable Maintenance Mode
  ansible.builtin.command:
    cmd: rpk cluster maintenance enable {{ node_id }} --wait {{ redpanda_rpk_opts }}
  # rpk can't authenticate to the Admin API from the credentials in redpanda.yaml once
  # admin_api_require_auth is on; pass them the way the role's other rpk calls do.
  environment: "{{ {'RPK_USER': sasl_superuser_username, 'RPK_PASS': sasl_superuser_password} if (kafka_enable_authorization | default(false) | bool) else {} }}"
  no_log: "{{ redpanda_broker_no_log }}"
  when:
    - restart_required
    - inventory_hostname == cluster_host
    - ansible_play_hosts | length > 1

# We need to (actually) generate the node config once the node is in MM, otherwise the `rpk cluster maintenance` command
# will fail
- name: Generate Node config - post-bootstrap runs
  ansible.builtin.template:
    src: redpanda.yml
    dest: /etc/redpanda/redpanda.yaml
    owner: redpanda
    group: redpanda
    mode: "0644"
  register: nodeconfig_result
  when:
    - is_initialized
    - inventory_hostname == cluster_host

- name: Restart Redpanda
  ansible.builtin.systemd:
    name: redpanda
    state: restarted
  when:
    - restart_required
    - inventory_hostname == cluster_host

- name: Disable Maintenance Mode
  ansible.builtin.command:
    cmd: rpk cluster maintenance disable {{ node_id }} {{ redpanda_rpk_opts }}
  # rpk can't authenticate to the Admin API from the credentials in redpanda.yaml once
  # admin_api_require_auth is on; pass them the way the role's other rpk calls do.
  environment: "{{ {'RPK_USER': sasl_superuser_username, 'RPK_PASS': sasl_superuser_password} if (kafka_enable_authorization | default(false) | bool) else {} }}"
  # the restarted broker's Admin API may not answer yet
  register: redpanda_broker_maintenance_disable
  until: redpanda_broker_maintenance_disable.rc == 0
  retries: 60
  delay: 5
  no_log: "{{ redpanda_broker_no_log }}"
  when:
    - restart_required
    - inventory_hostname == cluster_host
    - ansible_play_hosts | length > 1

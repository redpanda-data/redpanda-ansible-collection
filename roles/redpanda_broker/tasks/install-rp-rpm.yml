---
- name: Set fact for package names
  ansible.builtin.set_fact:
    redpanda_version_suffix: "{{ '' if redpanda_version == 'latest' else '-' + redpanda_version }}"
    needs_split_packages: >-
      {{ redpanda_version == 'latest' or 
         (redpanda_version is version('24.2.0', '>=')) or
         development_build | default(false) | bool }}
    allow_lower_version: "{{ development_build | default(false) | bool }}"

- name: check OS FIPS mode state to see if configured and safe for Redpanda to proceed with fips_mode=enabled
  ansible.builtin.include_tasks: fips-assert.yml
  when:
   - enable_fips | default(false) | bool

- name: generate package list to install
  ansible.builtin.set_fact:
    redpanda_package_list: "{{ ['redpanda-rpk-fips', 'redpanda', 'redpanda-fips', 'redpanda-tuner'] if enable_fips | bool else ['redpanda-rpk','redpanda','redpanda-tuner']  }}"

- name: generate versioned package list to install
  ansible.builtin.set_fact:
    redpanda_package_list_versioned: "{{ redpanda_package_list | product([redpanda_version_suffix]) | map('join') | list }}"

# One install task for both package generations: pre/post-24.2 twins that
# each `register: package_result` would leave the skipped twin's stub in the
# register, so the SASL bootstrap stop below and the upgrade-restart logic
# never saw the install as changed on pinned pre-24.2 versions.
#
# The versioned package names ensure a pinned redpanda_version is honored;
# with redpanda_version=latest the suffix is empty and the list is identical
# to the unversioned one. Installing the list in one dnf transaction (rather
# than a per-package loop) also lets dnf resolve the packages together.
- name: Install redpanda
  ansible.builtin.dnf:
    name: "{{ redpanda_package_list_versioned if needs_split_packages else (['redpanda' + redpanda_version_suffix]) }}"
    state: "{{ redpanda_install_status }}"
    update_cache: true
    allow_downgrade: "{{ allow_lower_version }}"
  environment:
    https_proxy: "{{ https_proxy_value | default('') }}"
    http_proxy: "{{ https_proxy_value | default('') }}"
  register: package_result

# Stop redpanda if it auto-started after package installation
# This prevents it from initializing before we can configure SASL
- name: Stop redpanda after installation (for SASL bootstrap)
  ansible.builtin.systemd:
    name: redpanda
    state: stopped
  when:
    - kafka_enable_authorization | default(false) | bool
    - package_result.changed | default(false)

- name: Clear data directory for SASL bootstrap if needed
  ansible.builtin.include_tasks: clear-data-for-sasl.yml

- name: Set data dir file perms
  ansible.builtin.file:
    path: "{{ redpanda_data_directory }}"
    state: directory
    owner: redpanda
    group: redpanda

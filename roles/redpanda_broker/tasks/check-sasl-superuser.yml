---
# Stop before changing a running cluster when kafka_enable_authorization is
# set but the SASL superuser can't be used.
#
# The bootstrap superuser is created only when a cluster first starts
# (RP_BOOTSTRAP_USER in start-redpanda.yml), but `superusers` and
# `admin_api_require_auth` are applied to running clusters on every run. On a
# cluster that existed before SASL was enabled, continuing would require Admin
# API authentication for a user that doesn't exist and lock the Admin API.
#
# Listing users doesn't prove the password: while admin_api_require_auth is
# off, Redpanda treats a request with a wrong password as anonymous and answers
# it. Enabling admin_api_require_auth is accepted only from an authenticated
# superuser, so a dry run of that change is used to check the password.
#
# Included by start-redpanda.yml after Redpanda is running and before any
# cluster or node configuration is changed.

- name: List SASL users on the existing cluster
  ansible.builtin.command:
    cmd: "rpk security user list {{ redpanda_rpk_opts }}"
  environment:
    RPK_USER: "{{ sasl_superuser_username }}"
    RPK_PASS: "{{ sasl_superuser_password }}"
  register: redpanda_broker_sasl_users
  changed_when: false
  failed_when: false
  no_log: "{{ redpanda_broker_no_log }}"
  when:
    - is_initialized | bool
    - kafka_enable_authorization | bool
  tags: [broker_check_sasl_superuser]

- name: Fail if the cluster rejects the SASL superuser credentials
  ansible.builtin.fail:
    msg: >-
      Couldn't list SASL users as '{{ sasl_superuser_username }}' on the existing
      cluster (rpk exit {{ redpanda_broker_sasl_users.rc }}): {{ redpanda_broker_sasl_users.stderr | trim }}.
      Check sasl_superuser_username and sasl_superuser_password. No cluster or
      node configuration was changed.
  when:
    - is_initialized | bool
    - kafka_enable_authorization | bool
    - redpanda_broker_sasl_users.rc != 0
  tags: [broker_check_sasl_superuser]

- name: Fail if the existing cluster has no SASL superuser
  ansible.builtin.fail:
    msg: >-
      kafka_enable_authorization is true, but this cluster already exists and
      has no SASL user named '{{ sasl_superuser_username }}'. The playbook creates
      the superuser only when a cluster first starts, so continuing would require
      Admin API authentication for a user that doesn't exist. Create the user on
      the running cluster first, for example
      `rpk security user create {{ sasl_superuser_username }} --mechanism SCRAM-SHA-256 -p <password>`,
      then rerun the playbook. No cluster or node configuration was changed.
  when:
    - is_initialized | bool
    - kafka_enable_authorization | bool
    - redpanda_broker_sasl_users.rc == 0
    - sasl_superuser_username not in (redpanda_broker_sasl_users.stdout_lines | map('trim') | list)
  tags: [broker_check_sasl_superuser]

# The Admin API address and TLS settings come from the node config on disk, the
# one the running broker and rpk use; this run hasn't rewritten it yet.
- name: Read the running broker's node config
  ansible.builtin.slurp:
    src: "{{ redpanda_broker_node_config_file | default('/etc/redpanda/redpanda.yaml') }}"
  register: redpanda_broker_node_config_raw
  when:
    - is_initialized | bool
    - kafka_enable_authorization | bool
  tags: [broker_check_sasl_superuser]

- name: Check the SASL superuser's password with a dry-run config request
  vars:
    node_config: "{{ redpanda_broker_node_config_raw.content | b64decode | from_yaml }}"
    admin_listener: "{{ [node_config.redpanda.admin] | flatten | first }}"
    admin_tls: "{{ node_config.rpk.admin_api.tls | default({}) }}"
  ansible.builtin.uri:
    url: "{{ 'https' if admin_tls else 'http' }}://{{ admin_listener.address }}:{{ admin_listener.port }}/v1/cluster_config?dry_run=true"
    method: PUT
    url_username: "{{ sasl_superuser_username }}"
    url_password: "{{ sasl_superuser_password }}"
    force_basic_auth: true
    ca_path: "{{ admin_tls.ca_file | default(admin_tls.truststore_file) | default(omit) }}"
    body_format: json
    body:
      upsert:
        superusers: ["{{ sasl_superuser_username }}"]
        admin_api_require_auth: true
      remove: []
    return_content: true
  register: redpanda_broker_sasl_password_check
  changed_when: false
  failed_when: false
  no_log: "{{ redpanda_broker_no_log }}"
  when:
    - is_initialized | bool
    - kafka_enable_authorization | bool
  tags: [broker_check_sasl_superuser]

- name: Fail if the cluster doesn't accept the SASL superuser's password
  ansible.builtin.fail:
    msg: >-
      The existing cluster has a SASL user named '{{ sasl_superuser_username }}'
      but didn't accept the password for '{{ sasl_superuser_username }}': a dry
      run of enabling admin_api_require_auth as that user was refused
      ({{ redpanda_broker_sasl_password_check.content | default('') | trim }}).
      Check sasl_superuser_password, or reset the user's password on the cluster
      with `rpk security user update`. No cluster or node configuration was changed.
  when:
    - is_initialized | bool
    - kafka_enable_authorization | bool
    - redpanda_broker_sasl_password_check.status == 400
  tags: [broker_check_sasl_superuser]

- name: Fail if the SASL superuser's password couldn't be checked
  ansible.builtin.fail:
    msg: >-
      Couldn't check the password for '{{ sasl_superuser_username }}' against the
      Admin API at {{ redpanda_broker_sasl_password_check.url | default('') }}
      (HTTP status {{ redpanda_broker_sasl_password_check.status }}):
      {{ redpanda_broker_sasl_password_check.content | default(redpanda_broker_sasl_password_check.msg, true) | default('') | trim }}.
      No cluster or node configuration was changed.
  when:
    - is_initialized | bool
    - kafka_enable_authorization | bool
    - redpanda_broker_sasl_password_check.status not in [200, 400]
  tags: [broker_check_sasl_superuser]

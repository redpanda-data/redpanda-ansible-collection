---
bugfixes:
  - user_management - existing usernames were never extracted from rpk's
    JSON output, so every user was re-created on every run and
    ``update_password`` never took effect; empty rpk output no longer
    crashes the role; ACL creation and role assignment are now diffed
    against cluster state instead of re-applied unconditionally; sasl item
    lists without a ``state`` key no longer error.
  - demo_certs - the role could not run standalone (``root_ca_dir`` and
    ``truststore_file_name`` were defined nowhere), cert issuance hardcoded
    the CA path, re-runs wiped the CA serial database (re-issuing serials
    already in circulation) and rebuilt the truststore every play, and CA
    generation re-ran every play due to mismatched ``creates`` paths. The
    dead keystore task files that never produced a keystore are removed
    (the connect role owns keystore creation).
  - client_config - ``rpk_base_url`` was dead (the download URL hardcoded
    GitHub latest), there was no version pin or checksum option, and cert
    installation lacked privilege escalation.
  - binary_bundler - DEB URLs used the RPM architecture name (every deb
    download 404ed), noarch/SRPMS URLs embedded the host arch (always
    404ed), the package-split gate compared versions as strings (24.10+
    lost rpk/tuner), and bundling swept and deleted pre-existing
    ``/tmp/redpanda*`` files; downloads now verify optional checksums and
    run in an isolated per-run directory.
security_fixes:
  - user_management - loop labels no longer print user passwords into play
    output; demo_certs and user_management pass secrets via environment
    instead of recorded command lines.
  - demo_certs - generated CA and node private keys are now 0600 (openssl
    wrote them world-readable).
minor_changes:
  - all ten roles now carry containerized test suites; sysctl_setup pins
    its managed kernel settings.

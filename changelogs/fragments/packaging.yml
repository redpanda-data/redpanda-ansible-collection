---
minor_changes:
  - the collection artifact no longer packages development scaffolding
    (virtualenvs, IDE state, Dockerfiles, test trees, CI configuration) --
    ``build_ignore`` now curates the payload.
  - galaxy.yml declares the ``community.general`` and ``ansible.posix``
    dependencies the roles require, so bare ansible-core installs resolve
    them automatically.
  - galaxy.yml repository and issue-tracker URLs point at
    redpanda-ansible-collection instead of the retired
    deployment-automation repository.
  - changelog machinery (antsibull-changelog) is in place; future changes
    ship changelog fragments.

---
bugfixes:
  - redpanda_connect - the staged-keystore check ran on the managed host
    against a control-node path, so a pre-built keystore was never found and
    a self-signed one was regenerated (and Connect restarted) on every run;
    the check is now delegated to the control node.
  - redpanda_connect - keystore generation is idempotent (``creates`` guard)
    and the keystore password is delivered via the environment instead of
    the openssl command line.
  - redpanda_connect - the jmx-exporter task rewrote connect-log4j.properties
    gated on the wrong override variable, silently clobbering user log4j
    overrides; the log4j file is owned solely by the log4j generator, and
    both generators now feed restart detection. The jmx merge chain also
    crashed on modern ansible-core and is fixed.
  - redpanda_connect - ``connect_distributed_config_file`` was honored by
    the systemd unit but ignored by the config writer, producing a unit that
    pointed at a file that never existed.
  - redpanda_connect - plays without a connect inventory group crashed on
    ``groups[redpanda_connect_group]``; it now defaults to an empty list.
  - redpanda_connect - the post-restart REST health check was skipped on
    single-host plays, reporting success on a dead service.
  - redpanda_connect - installing without the pre-staged RPM failed with an
    opaque dnf error; the contract (pre-staged file or ``connect_rpm_url``,
    optionally ``connect_rpm_checksum``) is now asserted with an actionable
    message.
security_fixes:
  - redpanda_connect - the node TLS key was world-readable (0644) and the
    generated keystore was 0755; keys are now 0600 and keystores/truststores
    0640.
minor_changes:
  - redpanda_broker - load-bearing role inputs are validated by an argument
    spec at role entry (install status and FIPS mode choices, listener
    shape), failing with named errors instead of mid-play Jinja tracebacks.

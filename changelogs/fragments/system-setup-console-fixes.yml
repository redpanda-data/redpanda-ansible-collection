---
bugfixes:
  - system_setup - the data-directory preparation silently fell through to
    the root filesystem when no eligible data volume was found (no NVMe
    device, pre-partitioned volumes, or sdb-style device names); it now
    fails with an actionable message unless ``allow_unmounted_data_dir`` is
    explicitly set.
  - system_setup - the data volume mountpoint was hardcoded to
    /mnt/vectorized while the data path honored ``redpanda_mount_dir``, so
    overriding the variable put data on the root disk; the mountpoint now
    derives from the variable (``redpanda_mount_point``).
  - system_setup - unpartitioned devices backing mounted filesystems
    (including the root device) were eligible for mkfs/RAID; they are now
    excluded.
  - system_setup - proxy flags were compared with boolean identity
    (``is true``), so string values from ``-e`` or INI inventories silently
    disabled proxy configuration; they are now coerced with ``| bool``.
  - system_setup - configuring the dnf proxy overwrote all of
    /etc/dnf/dnf.conf; only the proxy key is managed now.
  - redpanda_console - the configuration was rendered before the RPM install
    that decides between the v2 and v3 config schema, so RHEL-family hosts
    could get a config the installed console cannot parse; configuration now
    follows installation.
  - redpanda_console - ``enable_airgap`` was compared with boolean identity,
    so ``-e enable_airgap=false`` skipped repository configuration and the
    install failed; it is coerced with ``| bool`` now.
  - redpanda_console - the console was restarted on every play (an
    unconditional ``state=restarted`` plus the handler); it is now only
    started, with restarts driven by change notifications.
  - redpanda_console - the deb-src repository task overwrote the binary
    repository file with duplicate content; it is removed.
  - redpanda_console - ``is_using_unstable`` was silently ignored; the
    repository configuration now switches to the unstable channel like the
    broker role.
  - redpanda_console - missing certificate variables now fail with a named
    assertion at role entry instead of a raw undefined-variable error
    mid-play.
breaking_changes:
  - the misspelled ``repdanda_mount_dir`` backward-compatibility fallback is
    removed from both system_setup and redpanda_broker;
    ``redpanda_mount_dir`` (system_setup) is the single knob for the data
    volume path.
  - system_setup - hosts with no eligible data volume now fail the play
    instead of silently deploying to the root disk; set
    ``allow_unmounted_data_dir=true`` to restore the old behavior.
  - redpanda_broker and redpanda_console configuration files are no longer
    world-readable; set ``redpanda_config_file_mode`` if other local
    processes must read the broker config.
